plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'io.github.nanoforged'
version = '0.1.0'

repositories {
    mavenCentral()
}


dependencies {
    annotationProcessor(compileOnly("org.projectlombok:lombok:1.18.42"))
    implementation "net.lenni0451.classtransform:core:1.15.1"
    compileOnly fileTree(dir: 'lib', include: ['*.jar'])
    compileOnly("org.json:json:20140107")
    compileOnly("org.jetbrains:annotations:26.0.2")
    //annotationProcessor compileOnly("com.google.auto.service:auto-service:1.1.1")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest {
        attributes(
                'Premain-Class': 'io.github.nanoforged.launchredirector.LaunchRedirector',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

shadowJar {
    manifest {
        attributes(
                'Premain-Class': 'io.github.nanoforged.launchredirector.LaunchRedirector',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}


